<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melbourne Camera Wall — 30 Cameras</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#07101a;color:#edf6ff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07101a}
#wall{width:100vw;height:100dvh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3px;padding:2px}
.tile{position:relative;min-width:0;min-height:0;background:#01040a;overflow:hidden}.top{position:absolute;left:0;right:0;top:0;z-index:3;background:linear-gradient(#07111bee,#07111b66);display:flex;justify-content:space-between;gap:6px;align-items:center;padding:4px 7px;font-size:11px;font-weight:750;text-shadow:0 1px 2px #000}.top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top a{color:#a9e4f2;text-decoration:none;white-space:nowrap;font-size:10px}
.image{position:absolute;inset:0;overflow:hidden;cursor:zoom-in;background:#030a11}.image img,.image video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.image img{visibility:hidden}.image img.visible{visibility:visible}.image video{object-fit:contain;cursor:default}body.showwhole .image img{object-fit:contain}
.fail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-size:12px;color:#b7c8d4;pointer-events:none}.fail a{pointer-events:auto;color:#ffd9a8}.fail[hidden]{display:none}
#arrows{position:fixed;inset:0;pointer-events:none;z-index:6}#arrows button{pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);height:54px;width:34px;padding:0;border:1px solid #ffffff42;background:#050c17a3;color:#fff;border-radius:7px;font-size:24px;opacity:.42;cursor:pointer}#arrows button:hover,#arrows button:focus-visible{opacity:1;background:#0d2636ed}#prev{left:2px}#next{right:2px}
#pageHint{position:fixed;bottom:3px;left:50%;transform:translateX(-50%);z-index:7;background:#081525aa;padding:2px 8px;font-size:11px;border-radius:4px;pointer-events:none}#rotationToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9;padding:7px 14px;background:#0b2338ed;border:1px solid #4c7c99;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .2s}#rotationToast.show{opacity:1}
#overlay{position:fixed;inset:0;z-index:8;background:#02070d;display:none;flex-direction:column;padding:9px;gap:7px}#overlay.show{display:flex}#overlayHead{display:flex;justify-content:space-between;align-items:center;gap:8px}#zoomtitle{font-weight:bold}#close{background:#1b3448;border:1px solid #406177;border-radius:6px;color:white;padding:7px 10px;cursor:pointer}#zoomview{position:relative;flex:1;min-height:0}#zoomview img{object-fit:contain}
#wall.single{place-items:center}#wall.single .tile{width:min(90vw,calc(88dvh * 16 / 9));height:min(88dvh,calc(90vw * 9 / 16))}#wall.two{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:1fr!important}#wall.three .tile:nth-child(3){grid-column:1/3;justify-self:center;width:50%}
@media(max-width:780px){#wall{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr))}#wall.three .tile:nth-child(3){grid-column:auto;justify-self:stretch;width:auto}}
</style></head><body>
<nav id="arrows"><button id="prev" aria-label="Previous page">❮</button><button id="next" aria-label="Next page">❯</button></nav>
<main id="wall"></main><div id="pageHint" aria-live="polite"></div><div id="rotationToast" role="status"></div>
<div id="overlay"><div id="overlayHead"><span id="zoomtitle"></span><button id="close">✕ Close</button></div><div id="zoomview" class="image"></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const cameras=[{"id":"fed-square-live","name":"Federation Square · Live","kind":"city","mode":"hls","url":"https://cdn-cloudfront.ap-northeast-1.prod.ingest.aws-infra.dacast.com/live/88cad9cf-ef65-7336-8b98-824c1c6fad8c/source/index.m3u8"},{"id":"airport-moorabbin-135","name":"Moorabbin Airport · 135°","kind":"airport","mode":"jpeg","url":"https://argosatlas.com/api/cam/e2f1d7bf805bfbfc44/image"},{"id":"coast-0","name":"Beaumaris Yacht Club · Camera 1","kind":"coast","mode":"jpeg","url":"https://webcam.io/webcams/9B1QNM/latest.jpg"},{"id":"coast-1","name":"Beaumaris Yacht Club · Camera 2","kind":"coast","mode":"jpeg","url":"https://webcam.io/webcams/MEYLxM/latest.jpg"},{"id":"coast-2","name":"Carrum Sailing & Motor Boat Club","kind":"coast","mode":"jpeg","url":"https://csmbcwebcam.s3.ap-southeast-2.amazonaws.com/csmbc-cam.jpg"},{"id":"coast-4","name":"Sandringham Yacht Club","kind":"coast","mode":"jpeg","url":"http://webcam.syc.com.au:8080/-wvhttp-01-/GetOneShot"},{"id":"coast-5","name":"Royal Brighton Yacht Club","kind":"coast","mode":"jpeg","url":"https://rbyc.org.au/wp-content/uploads/ftp/webcam/webcam-image.jpg?qq=6aee71a845eec"},{"id":"coast-6","name":"Beaumaris Motor Yacht Squadron · Club Jetty","kind":"coast","mode":"jpeg","url":"https://cams.bmys.com.au/Club-Jetty.jpg"},{"id":"traffic-1","name":"Transurban JPEG 01 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam01.jpg"},{"id":"traffic-3","name":"Transurban JPEG 03 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam03.jpg"},{"id":"traffic-4","name":"Gibdon Street","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam04.jpg"},{"id":"traffic-5","name":"Transurban JPEG 05 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam05.jpg"},{"id":"traffic-6","name":"Transurban JPEG 06 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam06.jpg"},{"id":"traffic-7","name":"Transurban JPEG 07 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam07.jpg"},{"id":"traffic-8","name":"Transurban JPEG 08 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam08.jpg"},{"id":"traffic-9","name":"Transurban JPEG 09 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam09.jpg"},{"id":"traffic-10","name":"Transurban JPEG 10 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam10.jpg"},{"id":"traffic-13","name":"Transurban JPEG 13 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam13.jpg"},{"id":"traffic-14","name":"Transurban JPEG 14 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam14.jpg"},{"id":"traffic-15","name":"Transurban JPEG 15 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam15.jpg"},{"id":"traffic-16","name":"Transurban JPEG 16 · location unverified","kind":"traffic","mode":"jpeg","url":"https://cmlwebcam.transurban.com/wimages/webcam16.jpg"},{"id":"melbourne-cbd-west-crown","name":"Melbourne CBD · West towards Crown","kind":"city","mode":"jpeg","url":"https://view.myairportcams.com/MELBCBD/showimagecamera1.php"},{"id":"windy-1454734578","name":"Windy · Landscape panorama · 1454734578","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1454734578/original.jpg"},{"id":"windy-1624671412","name":"Windy · Outback landscape · 1624671412","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1624671412/original.jpg"},{"id":"windy-1701327133","name":"Windy · Weather station · Field · 1701327133","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1701327133/original.jpg"},{"id":"windy-1701328846","name":"Windy · Weather station · Town · 1701328846","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1701328846/original.jpg"},{"id":"windy-1724350907","name":"Windy · Golf course · Facing South · 1724350907","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1724350907/original.jpg"},{"id":"windy-1739751599","name":"Windy · Forest and clouds · 1739751599","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1739751599/original.jpg"},{"id":"windy-1793884592","name":"Windy · Weather station · Field · 1793884592","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1793884592/original.jpg"},{"id":"windy-1793898761","name":"Windy · Mt Quandong · 1793898761","kind":"windy","mode":"jpeg","url":"https://imgproxy.windy.com/_/full/plain/current/1793898761/original.jpg"}];
const PAGE_SIZE=9,ROTATE_MS=30000;let page=0,paused=false,modal=null;let stopFns=[];const wall=document.getElementById('wall');const byId=id=>document.getElementById(id);
function stopAll(){for(const fn of stopFns.splice(0)){try{fn()}catch(e){}}}
function viewer(cam,wrap){
 if(cam.mode==='hls'){
  const video=document.createElement('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.setAttribute('playsinline','');wrap.append(video);
  const msg=document.createElement('div');msg.className='fail';msg.textContent='Loading Federation Square stream…';wrap.append(msg);
  let hls=null,stopped=false;
  const fail=()=>{if(stopped)return;msg.hidden=false;msg.replaceChildren(document.createTextNode('Stream unavailable · '));const a=document.createElement('a');a.href='https://fedsquare.com/fed-cam';a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open on original site';msg.append(a)};
  video.addEventListener('playing',()=>{msg.hidden=true});video.addEventListener('error',fail);
  try{if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=cam.url;video.play().catch(fail)}else if(window.Hls&&window.Hls.isSupported()){hls=new Hls({liveSyncDurationCount:3,enableWorker:true});hls.loadSource(cam.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(fail));hls.on(Hls.Events.ERROR,(_e,data)=>{if(data.fatal)fail()})}else fail()}catch(e){fail()}
  stopFns.push(()=>{stopped=true;video.pause();if(hls)hls.destroy();video.removeAttribute('src')});return;
 }
 const imgs=[document.createElement('img'),document.createElement('img')];const msg=document.createElement('div');msg.className='fail';msg.textContent='Loading image…';imgs.forEach(im=>{im.alt=cam.name;wrap.append(im)});wrap.append(msg);
 let shown=-1,busy=false,stopped=false;let interval;
 function refresh(){if(stopped||busy||document.hidden)return;busy=true;const idx=shown===0?1:0,im=imgs[idx];let finished=false;
  const timeout=setTimeout(()=>finish(false),14000);
  function finish(ok){if(finished)return;finished=true;clearTimeout(timeout);im.onload=im.onerror=null;busy=false;if(ok){im.classList.add('visible');if(shown>=0)imgs[shown].classList.remove('visible');shown=idx;msg.hidden=true}else if(shown<0){msg.hidden=false;msg.replaceChildren(document.createTextNode('Image unavailable · '));const a=document.createElement('a');a.href=cam.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open original';msg.append(a)}}
  im.onload=()=>finish(true);im.onerror=()=>finish(false);
  try{const u=new URL(cam.url);u.searchParams.set('_wallRefresh',String(Date.now()));im.src=u.href;if(im.complete&&im.naturalWidth>0)finish(true)}catch(e){finish(false)}
 }
 refresh();interval=setInterval(refresh,cam.kind==='airport'?30000:cam.kind==='windy'?20000:cam.kind==='city'?15000:1500);
 stopFns.push(()=>{stopped=true;clearInterval(interval);imgs.forEach(im=>{im.onload=im.onerror=null})});
}
function render(){stopAll();wall.replaceChildren();const pages=Math.ceil(cameras.length/PAGE_SIZE);page=((page%pages)+pages)%pages;const active=cameras.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);wall.classList.toggle('single',active.length===1);wall.classList.toggle('two',active.length===2);wall.classList.toggle('three',active.length===3);if(innerWidth>780){wall.style.gridTemplateColumns=active.length===1?'1fr':active.length===2?'repeat(2,minmax(0,1fr))':'repeat(3,minmax(0,1fr))';wall.style.gridTemplateRows=active.length<=2?'1fr':active.length===3?'repeat(2,minmax(0,1fr))':'repeat(3,minmax(0,1fr))'}else{wall.style.gridTemplateColumns='';wall.style.gridTemplateRows=''}
 for(const cam of active){const tile=document.createElement('section');tile.className='tile';const bar=document.createElement('div');bar.className='top';const title=document.createElement('span');title.textContent=`${cameras.indexOf(cam)+1}/${cameras.length} · ${cam.name}`;const link=document.createElement('a');link.href=cam.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=cam.mode==='hls'?'Open stream ↗':'Open image ↗';bar.append(title,link);const area=document.createElement('div');area.className='image';if(cam.mode!=='hls')area.addEventListener('click',()=>zoom(cam));viewer(cam,area);tile.append(bar,area);wall.append(tile)}byId('pageHint').textContent=`${active.length} on page ${page+1}/${pages} · ${cameras.length} cameras total`;
}
function next(n){closeZoom(false);page+=n;render()}
function zoom(cam){stopAll();modal=cam;byId('overlay').classList.add('show');byId('zoomtitle').textContent=cam.name;viewer(cam,byId('zoomview'))}
function closeZoom(rerender=true){if(!modal)return;stopAll();byId('zoomview').replaceChildren();byId('overlay').classList.remove('show');modal=null;if(rerender)render()}
byId('prev').onclick=()=>next(-1);byId('next').onclick=()=>next(1);byId('close').onclick=()=>closeZoom();
let toastTimeout;function toggleRotation(){paused=!paused;const el=byId('rotationToast');el.textContent=paused?'Auto-rotation OFF':'Auto-rotation ON';el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),1400)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom();else if(e.key==='ArrowRight'){e.preventDefault();next(1)}else if(e.key==='ArrowLeft'){e.preventDefault();next(-1)}else if(e.key.toLowerCase()==='r'||e.key===' '){e.preventDefault();toggleRotation()}});
setInterval(()=>{if(!paused&&!modal)next(1)},ROTATE_MS);render();
</script></body></html>
